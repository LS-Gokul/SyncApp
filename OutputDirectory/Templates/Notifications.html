<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="chrome=1,IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {background-color: azure;display: flex;justify-content: center;align-items: center;flex-direction:column;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        .card {margin: 0.25rem;border-radius: 16px;height: auto;background-color: #FFFFFF;width: 100%;display: flex;justify-content: center;align-items: flex-start;flex-direction: column;overflow: hidden;position: relative;box-shadow: 0px 0px 12px 8px rgba(0,0,0,0.15);max-width:100%;-webkit-box-shadow: 0px 0px 12px 8px rgba(0,0,0,0.15);-moz-box-shadow: 0px 0px 12px 8px rgba(0,0,0,0.15);}
        .card-icon {max-width: 80px;max-height: 80px;overflow: hidden;border-radius: 50%;}
        .card-icon img {height: 100%;width: 100%;}
        .card-body {display: flex;justify-content: center;align-items: flex-start;flex-direction: column;}
        .userName{font-size: 1.3rem;font-weight: 700;}
        .msg-content {font-size: .975rem;font-weight: 400;margin: 0; max-width: 70% }
        .card-footer {display: flex;justify-content: center;align-items: flex-start;flex-direction: row;width: 100%;border-top: 1px solid #ccc ;}
        .card-footer button:first-child {border-right: 1px solid #ccc;}
        .card-footer button:last-child {border-left: 1px solid #ccc;}
        .card-footer button {background-color: transparent;outline: 0;border: 0;width: 100%;padding: .5rem;font-size: 1rem;font-weight: 500;letter-spacing: 1px;color: rgb(86, 86, 86);transition: .2s cubic-bezier(.2,.2,.38,.9);}
        .card-footer button:hover, .card-footer button:focus  {background-color: #e5e5e5;color: #4958ff;}
        .dnone{display:none;}        .main-content{padding: 1rem;display: flex;justify-content: center;align-items: flex-start;flex-direction: row;gap: 1rem;}
        .clear {position: absolute;right: 10px;float: right;top: 10px;border: 0;outline: 0;padding: 0;background-color: transparent;text-decoration: underline;color: #4958ff;}
    </style>
</head>
<body></body>
</html>
