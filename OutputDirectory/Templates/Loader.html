<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta http-equiv="X-UA-Compatible" content="IE=edge">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Document</title>    <style>   		#preloader {  position: fixed;  top: 0;  left: 0;  right: 0;  bottom: 0;  z-index: 9999;  overflow: hidden;  background: white;}		#preloader:before {  content: "";  position: fixed;  top: calc(50% - 30px);  left: calc(50% - 30px);  border: 6px solid pink;  border-top-color: blue;  border-radius: 50%;  width: 60px;  height: 60px;  -webkit-animation: animate-preloader 1s linear infinite;  animation: animate-preloader 1s linear infinite;}		@-webkit-keyframes animate-preloader {  0% {    transform: rotate(0deg);  }  100% {    transform: rotate(360deg);  }}		@keyframes animate-preloader {  0% {    transform: rotate(0deg);  }  100% {    transform: rotate(360deg);  }}    </style></head><body>    <div id="preloader"></div></body></html>
